services:
  ghosthub:
    build: .
    container_name: ghosthub
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ghosthub_data:/data
    expose:
      - "8000"
    networks:
      - app-network

  postgres:
    image: postgres:17-alpine
    container_name: ghosthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghosthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghosthub}
      POSTGRES_DB: ${POSTGRES_DB:-ghosthub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghosthub} -d ${POSTGRES_DB:-ghosthub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  ghosthub_data:
  postgres_data:

networks:
  app-network:
    external: true
